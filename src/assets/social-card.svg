    <rect x="599" y="406" width="534" height="38" fill="#fff"/><text x="625" y="431" fill="#111" font-size="15">LinkedIn</text>
    <rect x="599" y="444" width="534" height="38" fill="#fff"/><text x="625" y="469" fill="#111" font-size="15">Instagram</text>
