<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="desktop" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#6766a4"/>
      <rect width="2" height="2" fill="#7473ad"/>
      <rect x="2" y="2" width="2" height="2" fill="#59588f"/>
    </pattern>
    <pattern id="stripes" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#fff"/>
      <rect y="2" width="5" height="1" fill="#111"/>
    </pattern>
    <clipPath id="portrait">
      <rect x="93" y="193" width="220" height="220"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#desktop)"/>
  <rect width="1200" height="34" fill="#d6d6d6"/>
  <rect y="32" width="1200" height="2" fill="#111"/>
  <rect x="14" y="7" width="21" height="21" fill="#111"/>
  <text x="24.5" y="22" text-anchor="middle" fill="#fff" font-family="Verdana,Arial,sans-serif" font-size="8" font-weight="700">AW</text>
  <text x="45" y="23" fill="#111" font-family="Verdana,Arial,sans-serif" font-size="15" font-weight="700">Ashley Desktop</text>
  <text x="184" y="23" fill="#111" font-family="Verdana,Arial,sans-serif" font-size="15">About</text>
  <text x="247" y="23" fill="#111" font-family="Verdana,Arial,sans-serif" font-size="15">Profiles</text>
  <circle cx="1030" cy="17" r="5" fill="#087f23" stroke="#111"/>
