    <rect x="599" y="254" width="534" height="38" fill="#fff"/><text x="625" y="279" fill="#111" font-size="15">Twitter</text>
    <rect x="599" y="292" width="534" height="38" fill="#fff"/><text x="625" y="317" fill="#111" font-size="15">Bluesky</text>
    <rect x="599" y="330" width="534" height="38" fill="#fff"/><text x="625" y="355" fill="#111" font-size="15">Threads</text>
