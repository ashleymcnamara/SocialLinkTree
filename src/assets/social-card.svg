  <rect x="1030" y="65" width="52" height="46" fill="#d6d6d6" stroke="#111" stroke-width="3"/>
  <text x="1056" y="94" text-anchor="middle" fill="#111" font-family="Verdana,Arial,sans-serif" font-size="12" font-weight="700">AW</text>
  <text x="1056" y="128" text-anchor="middle" fill="#fff" font-family="Verdana,Arial,sans-serif" font-size="13" font-weight="700">About Ashley</text>
