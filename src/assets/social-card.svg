  <text x="345" y="208" fill="#000080" font-family="Verdana,Arial,sans-serif" font-size="16" font-weight="700">Welcome to my corner of the internet.</text>
  <text x="345" y="260" fill="#111" font-family="Verdana,Arial,sans-serif" font-size="42" font-weight="700">Ashley Willis</text>
  <text x="345" y="304" fill="#111" font-family="Verdana,Arial,sans-serif" font-size="19">Developer advocate,</text>
  <text x="345" y="332" fill="#111" font-family="Verdana,Arial,sans-serif" font-size="19">open-source enthusiast,</text>
  <text x="345" y="360" fill="#111" font-family="Verdana,Arial,sans-serif" font-size="19">professional internet person.</text>
  <rect x="345" y="385" width="174" height="62" fill="#fff" stroke="#555"/>
  <rect x="345" y="385" width="62" height="31" fill="#d9d9f3"/>
  <rect x="345" y="416" width="62" height="31" fill="#d9d9f3"/>
